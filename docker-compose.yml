# Portainer: Stacks → Add stack → Web editor → cole este arquivo → preencha
# as variáveis abaixo em "Environment variables" → Deploy.
# DNS: aponte PLATFORM_DOMAIN e *.PLATFORM_DOMAIN pro IP do servidor, com as
# portas 80/443 liberadas (usadas pelo Caddy pra emitir HTTPS).
services:
  site:
    build:
      context: https://github.com/Glivan2903/template_illo.git#main # troque se mudar de repositório/branch
      dockerfile: Dockerfile
    image: clinsaude-site:latest
    restart: unless-stopped
    expose:
      - '3000'
    environment:
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN} # domínio raiz da plataforma
      SUPERADMIN_USER: ${SUPERADMIN_USER:-superadmin}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD} # obrigatório
      SESSION_SECRET: ${SESSION_SECRET} # obrigatório — openssl rand -hex 32
      SETTINGS_ENC_KEY: ${SETTINGS_ENC_KEY} # obrigatório — openssl rand -hex 32
      OPENAI_MODEL: ${OPENAI_MODEL:-} # opcional
    volumes:
      - clinsaude_data:/app/data
      - clinsaude_uploads:/app/public/uploads
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch(\"http://127.0.0.1:3000/\").then(()=>process.exit(0)).catch(()=>process.exit(1))']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - site
    ports:
      - '80:80'
      - '443:443'
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config

configs:
  caddyfile:
    content: |
      {
      	on_demand_tls {
      		ask http://site:3000/api/tenant/domain-check
      	}
      }

      :443 {
      	tls {
      		on_demand
      	}
      	reverse_proxy site:3000
      }

      :80 {
      	redir https://{host}{uri} permanent
      }

volumes:
  clinsaude_data:
  clinsaude_uploads:
  caddy_data:
  caddy_config:
