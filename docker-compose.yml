# Stack 100% autossuficiente pra deploy via Portainer: cole SÓ este arquivo
# em Stacks → Add stack → Web editor, preencha as variáveis na seção
# "Environment variables" da tela (nunca ficam commitadas aqui) e Deploy.
# Não precisa subir Dockerfile, Caddyfile nem nenhum outro arquivo:
# - `site.build.context` aponta pro repositório Git — o próprio Docker
#   clona o repo e builda a imagem a partir do Dockerfile que está nele.
# - o Caddyfile vem embutido no `configs` abaixo (Compose monta o conteúdo
#   como arquivo dentro do container, sem precisar de bind mount).
#
# Dois serviços:
# - site: o app Next.js multi-empresa (banco SQLite + uploads num volume).
# - caddy: proxy reverso na frente, com HTTPS automático (Let's Encrypt) —
#   tanto para o domínio raiz da plataforma quanto para o subdomínio de cada
#   empresa e qualquer domínio próprio que ela configurar no /superadmin
#   (ver app/api/tenant/domain-check).
#
# Pré-requisito de DNS: aponte PLATFORM_DOMAIN e *.PLATFORM_DOMAIN (registro
# coringa) para o IP deste servidor, e (por empresa, quando aplicável) o
# domínio próprio do cliente também apontando pra cá. Portas 80/443 do
# servidor precisam estar liberadas — são usadas pelo Caddy para emitir os
# certificados.
#
# Variáveis (preencher em "Environment variables" no Portainer, ou num
# .env ao lado deste arquivo se for subir via `docker compose up -d`):
#   PLATFORM_DOMAIN      domínio raiz da plataforma (ex.: suaplataforma.com.br)
#   SUPERADMIN_USER      login do /superadmin (padrão: superadmin)
#   SUPERADMIN_PASSWORD  senha do /superadmin — obrigatória, sem ela não dá
#                        pra entrar
#   SESSION_SECRET       assina o cookie de sessão — gere com
#                        `openssl rand -hex 32`
#   SETTINGS_ENC_KEY     criptografa settings de cada empresa — gere com
#                        `openssl rand -hex 32`
#   OPENAI_MODEL         opcional — modelo padrão quando a empresa não
#                        define um
services:
  site:
    build:
      context: https://github.com/Glivan2903/template_illo.git#main
      dockerfile: Dockerfile
    image: clinsaude-site:latest
    restart: unless-stopped
    expose:
      - '3000'
    environment:
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN}
      SUPERADMIN_USER: ${SUPERADMIN_USER:-superadmin}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      SETTINGS_ENC_KEY: ${SETTINGS_ENC_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    volumes:
      - clinsaude_data:/app/data
      - clinsaude_uploads:/app/public/uploads
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch(\"http://127.0.0.1:3000/\").then(()=>process.exit(0)).catch(()=>process.exit(1))']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - site
    ports:
      - '80:80'
      - '443:443'
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config

configs:
  caddyfile:
    content: |
      # Proxy reverso com HTTPS automático (Let's Encrypt) para qualquer host
      # que pertença à plataforma — domínio raiz, subdomínio de empresa
      # (<slug>.PLATFORM_DOMAIN) ou domínio próprio configurado no /superadmin.
      # Como os hosts são dinâmicos (empresas são criadas depois do deploy,
      # sem redeploy), o certificado é emitido "on demand" na primeira visita
      # a cada host — o endpoint `ask` confere no app se aquele host é
      # conhecido antes de pedir o certificado, pra ninguém conseguir emitir
      # certificado através deste servidor pra um domínio que não é de uma
      # empresa cadastrada.
      {
      	on_demand_tls {
      		ask http://site:3000/api/tenant/domain-check
      	}
      }

      :443 {
      	tls {
      		on_demand
      	}
      	reverse_proxy site:3000
      }

      :80 {
      	redir https://{host}{uri} permanent
      }

volumes:
  clinsaude_data:
  clinsaude_uploads:
  caddy_data:
  caddy_config:
